<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Live board</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#f3f1f8; --ink:#2b2540; --muted:#7a7491; --accent:#ff7aa8; --ok:#20b39b; --warn:#f08a24; }
@media (prefers-color-scheme: dark) { :root { --bg:#1b1830; --ink:#f1eefc; --muted:#a9a3c4; } .top, .tools, button { background:#2a2645 !important; } .stage .canvas-container { background:#fff; } }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; }
body { background:var(--bg); color:var(--ink); font-family:"M PLUS Rounded 1c",sans-serif; font-weight:700; display:flex; flex-direction:column; overflow:hidden; overscroll-behavior:none; }
.top { display:flex; align-items:center; gap:8px; padding:8px 12px; background:#fff; border-bottom:2.5px solid var(--ink); }
.top h1 { white-space:nowrap; }
.top h1 { font-size:17px; margin:0; font-weight:800; }
.pill { font-size:13px; padding:4px 12px; border-radius:99px; border:2px solid var(--ink); background:#fff; color:#2b2540; }
.pill.ok { background:var(--ok); color:#fff; } .pill.wait { background:#ffe9b8; }
.grow { flex:1; }
button { font:inherit; font-weight:800; font-size:13px; padding:7px 11px; color:var(--ink); background:#fff; border:2.5px solid var(--ink); border-radius:11px; cursor:pointer; touch-action:manipulation; white-space:nowrap; }
button.on { background:var(--ink); color:var(--bg); }
.tools { display:flex; align-items:center; gap:6px; padding:8px 12px; background:#fff; border-bottom:2.5px solid var(--ink); overflow-x:auto; flex-shrink:0; }
.tools .sep { width:2px; height:26px; background:#d8d3e6; margin:0 4px; flex-shrink:0; }
.sw { width:28px; height:28px; border-radius:50%; border:2.5px solid #fff; outline:2px solid #d8d3e6; padding:0; flex-shrink:0; }
.sw.on { outline:3px solid var(--ink); }
.stage { flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:0; padding:10px; }
.stage .canvas-container { box-shadow:0 0 0 2.5px var(--ink), 4px 4px 0 2.5px var(--ink); border-radius:4px; background:#fff; touch-action:none; }
#veil { position:absolute; inset:0; z-index:8; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; background:rgba(243,241,248,.88); font-size:18px; line-height:1.6; }
#veil[hidden] { display:none; }
.hint { font-size:11px; color:var(--muted); font-weight:500; padding:0 12px 6px; }
</style>
</head>
<body>
<div class="top">
  <h1>✏️ Live board</h1>
  <span class="pill wait" id="st">Connecting…</span>
  <span class="pill" id="pg" hidden></span>
  <span class="grow"></span>
  <button id="close" title="Close this page">✕</button>
</div>
<div class="tools" id="tools">
  <button data-tool="select">👆 Select</button>
  <button data-tool="text">🔤 Text</button>
  <button data-tool="rect">⬜ Box</button>
  <button data-tool="ellipse">⚪ Circle</button>
  <button data-tool="pen">✏️ Pen</button>
  <button data-tool="marker">🖍 Marker</button>
  <button data-tool="eraser">🧽 Eraser</button>
  <button data-tool="laser">🔴 Pointer</button>
  <span class="sep"></span>
  <span id="swatches" style="display:flex;gap:6px"></span>
  <span class="sep"></span>
  <button data-size="1">S</button><button data-size="2">M</button><button data-size="3">L</button>
  <span class="sep"></span>
  <button id="del">🗑 Delete</button>
</div>
<div class="stage" id="stage"><canvas id="c"></canvas>
  <div id="veil">Connecting…</div>
</div>
<div class="hint">Write together with Natsuki. What you write appears on her board too. Everything is saved on her side. 📱 Tip: turn your phone sideways for a bigger board.</div>

<script src="fabric.min.js"></script>
<script src="rt.js"></script>
<script src="livesync.js"></script>
<script>
const W = 1600, H = 900;
const URL_ = 'https://ozxlahysxpvxtzznzdoj.supabase.co', KEY = 'sb_publishable_wWMYDN0zawBXuAGi8AQyeg_9M-QQySW';   // 公開してよい鍵（読むだけ・Broadcast だけ）
const chan = decodeURIComponent(location.hash.slice(1));
const $ = s => document.querySelector(s);
const FONT = '"M PLUS Rounded 1c", sans-serif';
const COLORS = ['#2b2540', '#e8558d', '#4a8fd8', '#20a58f', '#f08a24', '#8c7cf0', '#ffffff'];
const SIZES = { 1: { font: 30, pen: 3, marker: 14, stroke: 3 }, 2: { font: 44, pen: 6, marker: 24, stroke: 4 }, 3: { font: 64, pen: 10, marker: 36, stroke: 6 } };
const touchDev = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
$('#close').onclick = () => { window.close(); setTimeout(() => { history.length > 1 ? history.back() : location.replace('about:blank'); }, 150); };
if (!/^lb-[0-9a-f]{32}$/.test(chan)) { $('#veil').textContent = 'This link is not complete. Please open the Live board from your own page (Board tab).'; throw new Error('no channel'); }

const canvas = new fabric.Canvas('c', { backgroundColor: '#fff', preserveObjectStacking: true, selectionColor: 'rgba(74,143,216,.12)', selectionBorderColor: '#4a8fd8' });
fabric.Object.prototype.set({ cornerColor: '#4a8fd8', cornerStyle: 'circle', borderColor: '#4a8fd8', transparentCorners: false, cornerSize: touchDev ? 20 : 12, touchCornerSize: 28 });
let tool = 'select', color = '#4a8fd8', size = 2;
const isText = o => o.type === 'i-text' || o.type === 'textbox';
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

function fit() {
  const st = $('#stage'), s = Math.max(0.15, Math.min((st.clientWidth - 20) / W, (st.clientHeight - 20) / H));
  canvas.setDimensions({ width: W * s, height: H * s }); canvas.setZoom(s);
  if (LS) LS.placeLaser();
}
window.addEventListener('resize', fit);

function applyToolSel() {
  canvas.forEachObject(o => { const on = tool === 'select' || (tool === 'text' && isText(o)); o.selectable = on; o.evented = on || tool === 'eraser'; });
}
function setTool(t) {
  tool = t;
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  canvas.isDrawingMode = t === 'pen' || t === 'marker';
  if (canvas.isDrawingMode) {
    const br = new fabric.PencilBrush(canvas);
    br.width = SIZES[size][t]; br.color = t === 'marker' ? hexA(color, .35) : color; br.decimate = 2;
    canvas.freeDrawingBrush = br;
  }
  canvas.selection = t === 'select';
  canvas.defaultCursor = t === 'select' ? 'default' : t === 'eraser' ? 'cell' : t === 'laser' ? 'none' : 'crosshair';
  applyToolSel();
  if (t !== 'select') canvas.discardActiveObject();
  canvas.requestRenderAll();
}
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
$('#swatches').innerHTML = COLORS.map(c => `<button class="sw${c === color ? ' on' : ''}" data-c="${c}" style="background:${c}" aria-label="color"></button>`).join('');
document.querySelectorAll('.sw').forEach(b => b.onclick = () => {
  color = b.dataset.c;
  document.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b));
  const o = canvas.getActiveObject();
  if (o) {
    (o.type === 'activeSelection' ? o.getObjects() : [o]).forEach(x => {
      if (isText(x)) x.set('fill', color);
      else if (x.type === 'path') x.set('stroke', x.stroke && x.stroke.startsWith('rgba') ? hexA(color, .35) : color);
      else if (x.type !== 'image') x.set('stroke', color);
    });
    canvas.requestRenderAll(); LS.touch();
  }
  if (canvas.isDrawingMode) setTool(tool);
});
document.querySelectorAll('[data-size]').forEach(b => b.onclick = () => {
  size = Number(b.dataset.size);
  document.querySelectorAll('[data-size]').forEach(x => x.classList.toggle('on', x === b));
  const o = canvas.getActiveObject();
  if (o && isText(o)) { o.set('fontSize', SIZES[size].font); canvas.requestRenderAll(); LS.touch(); }
  if (canvas.isDrawingMode) setTool(tool);
});
function removeSelected() {
  const o = canvas.getActiveObject();
  if (!o || o.isEditing) return;
  (o.type === 'activeSelection' ? o.getObjects() : [o]).forEach(x => canvas.remove(x));
  canvas.discardActiveObject(); canvas.requestRenderAll();
}
$('#del').onclick = removeSelected;
document.addEventListener('keydown', e => {
  const o = canvas.getActiveObject();
  if (e.target.tagName === 'INPUT' || (o && o.isEditing)) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeSelected(); }
});

let drawing = null, start = null, erasing = false;
canvas.on('mouse:down', opt => {
  if (!LS.live) return;
  if (tool === 'eraser') { erasing = true; if (opt.target) canvas.remove(opt.target); return; }
  if (tool === 'text') {
    if (opt.target && isText(opt.target)) return;
    const p = canvas.getPointer(opt.e);
    let txt = '';
    if (touchDev) { txt = prompt('Type your text'); if (!txt) return; }   // スマホでは、キーボードが出ないことがあるので入力欄で受ける
    const t = new fabric.IText(txt, { left: p.x, top: p.y - SIZES[size].font / 2, fontFamily: FONT, fontWeight: 700, fontSize: SIZES[size].font, fill: color, oid: Math.random().toString(36).slice(2, 10) });
    canvas.add(t); canvas.setActiveObject(t); if (!touchDev) t.enterEditing();
    return;
  }
  if (tool === 'rect' || tool === 'ellipse') {
    start = canvas.getPointer(opt.e);
    const base = { left: start.x, top: start.y, fill: 'transparent', stroke: color, strokeWidth: SIZES[size].stroke, strokeUniform: true, selectable: false, evented: false };
    drawing = tool === 'rect' ? new fabric.Rect({ ...base, width: 1, height: 1, rx: 16, ry: 16 }) : new fabric.Ellipse({ ...base, rx: 1, ry: 1 });
    holdSync = true; canvas.add(drawing);
  }
});
canvas.on('mouse:move', opt => {
  if (tool === 'laser') { const p = canvas.getPointer(opt.e); LS.laser(p.x, p.y, true); return; }
  if (erasing && opt.target) { canvas.remove(opt.target); return; }
  if (!drawing) return;
  const p = canvas.getPointer(opt.e), w = Math.abs(p.x - start.x), h = Math.abs(p.y - start.y);
  const pos = { left: Math.min(p.x, start.x), top: Math.min(p.y, start.y) };
  drawing.set(drawing.type === 'rect' ? { ...pos, width: w, height: h } : { ...pos, rx: w / 2, ry: h / 2 });
  canvas.requestRenderAll();
});
canvas.on('mouse:up', () => {
  erasing = false;
  if (!drawing) return;
  const d = drawing; drawing = null; holdSync = false;
  if ((d.width || 0) * (d.scaleX || 1) < 8 && (d.rx || 0) < 4) { canvas.remove(d); return; }
  d.set({ selectable: tool === 'select', evented: tool === 'select' }); d.setCoords(); LS.touch();
});
canvas.on('path:created', e => { if (tool === 'marker') { e.path.set('globalCompositeOperation', 'multiply'); canvas.requestRenderAll(); } });
canvas.on('text:editing:exited', e => { if (!e.target.text.trim()) canvas.remove(e.target); });
let holdSync = false;   // 箱・丸をドラッグしているあいだは送らない（形が決まってから送る）

const veil = $('#veil'), st = $('#st');
const MSG = {
  connecting: ['Connecting…', 'wait', 'Connecting…'],
  waiting: ['Waiting for Natsuki…', 'wait', 'Natsuki has not opened the board yet.\nThis page will start by itself when she does. 🌸'],
  live: ['🟢 Live with Natsuki', 'ok', ''],
  closed: ['Board closed', 'wait', 'Natsuki closed the board.\nThank you for today! You can close this page.'],
  offline: ['Reconnecting…', 'wait', 'The connection was lost. Trying again…']
};
const LS = LiveSync({
  canvas, role: 'student', url: URL_, key: KEY, chan, stage: $('#stage'),
  isBusy: () => holdSync,
  onStatus: k => { const m = MSG[k] || MSG.connecting; st.textContent = m[0]; st.className = 'pill ' + m[1]; veil.hidden = !m[2]; veil.style.whiteSpace = 'pre-line'; veil.textContent = m[2]; },
  onRemote: applyToolSel,
  onPage: (p, n) => { const e = $('#pg'); e.hidden = n < 2; e.textContent = `Page ${p + 1} / ${n}`; }
});
canvas.on('object:added', e => { const o = e.target; if (tool !== 'select' && !(tool === 'text' && isText(o)) && o !== drawing) { o.selectable = false; o.evented = tool === 'eraser'; } });
(async () => {
  await document.fonts.load('800 40px "M PLUS Rounded 1c"').catch(() => {});
  await document.fonts.load('700 40px "M PLUS Rounded 1c"').catch(() => {});
  fit(); setTool('pen'); document.querySelector('[data-size="2"]').classList.add('on');
  LS.start();
})();
</script>
</body>
</html>
