<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひらがなの にわ — Hiragana Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fff3d6;--ink:#1d2a44;--muted:#6f7587;--tomato:#ff6b4a;--mustard:#ffc531;--teal:#1fa89a;--mint:#6fd3c6;--coral:#ff9a7a;--sky:#a8c8ff;--lav:#c9b6ff;--peach:#ffd9a0;--pink:#ff6b4a;--pink-d:#d9452a;--yellow:#ffc531;--card:#fff;--ok:#1b9a6b;--bad:#e5483a;--soft:#fff3d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic",sans-serif;font-weight:500;line-height:1.55;min-height:100vh}
.kana{font-family:"Zen Maru Gothic",sans-serif;font-weight:700}
.dela,h1,h2{font-family:"Dela Gothic One","Zen Maru Gothic",sans-serif;font-weight:400}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 70px}
.screen{display:none}.screen.on{display:block}
h1{font-size:28px;margin:6px 0 2px;letter-spacing:.02em}
h2{display:flex;align-items:center;gap:10px;font-size:17px;color:var(--ink);margin:28px 0 12px}
h2 .n{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:42% 58% 55% 45%;background:var(--tomato);color:#fff;font-size:15px}
.sub{color:var(--muted);font-size:14px;margin:0}
.center{text-align:center}
.btn{font-family:inherit;font-weight:700;font-size:16px;color:var(--ink);background:#fff;border:none;border-radius:99px;padding:11px 22px;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.pink{background:var(--tomato);color:#fff}.btn.mint{background:var(--teal);color:#fff}.btn.yel{background:var(--mustard)}
.btn.sm{font-size:13px;padding:8px 15px}
.btn[disabled]{opacity:.4;pointer-events:none}
.card{background:#fff;border-radius:28px 12px 28px 12px;padding:14px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top .sp{flex:1}
.back{background:none;border:none;font-family:inherit;font-weight:700;color:var(--muted);font-size:14px;cursor:pointer;padding:4px 2px}
.mw{display:inline-block;line-height:0}
.rm .mascot{width:64px;height:64px}
.gm{text-align:center}.gm .mascot{width:84px;height:84px}
.mascot{width:104px;height:104px;object-fit:contain}
.emo{font-size:76px;line-height:1;display:inline-block}
.hello{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bubble{background:var(--ink);color:var(--bg);border-radius:26px 26px 26px 6px;padding:13px 18px;font-size:14.5px;font-weight:700;flex:1}
.bubble b{color:var(--mustard)}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:inherit;font-weight:700;font-size:14px;border:none;border-radius:22px 10px 22px 10px;background:#fff;padding:8px 15px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--teal);color:#fff}
.chip small{display:block;font-weight:500;opacity:.7;font-size:11px;line-height:1.2}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.row{border-radius:20px 8px 20px 8px;background:#fff;padding:9px 2px 7px;text-align:center;cursor:pointer;font-size:22px;line-height:1.1;transition:transform .08s}
.row:nth-child(3n+2){border-radius:8px 20px 8px 20px}
.row:active{transform:scale(.95)}
.row.on{background:var(--tomato);color:#fff}
.row small{display:block;font-size:10.5px;font-weight:500;opacity:.65;font-family:inherit}
.rowgroup{margin:4px 0 12px}
.rowgroup h3{font-size:13px;margin:14px 0 8px;color:var(--muted);font-weight:700}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.mode{display:flex;gap:10px;align-items:flex-start;border:none;border-radius:28px 12px 28px 12px;padding:15px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);background:#fff;min-height:96px;transition:transform .08s}
.mode:nth-child(even){border-radius:12px 28px 12px 28px}
.mode:active{transform:scale(.97)}
.mode .ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.mode .ic svg{width:24px;height:24px}
.mode b{display:block;font-size:16.5px;font-weight:700;line-height:1.25}
.mode span.d{display:block;font-size:12.5px;line-height:1.4;margin-top:3px;opacity:.75}
.mode[disabled]{opacity:.4;pointer-events:none;filter:grayscale(.6)}
.mode.wide{grid-column:1/-1;align-items:center;min-height:0;border-radius:28px 12px 28px 12px}
.m-write{background:var(--mustard)}.m-sound{background:var(--mint)}.m-catch{background:var(--coral)}.m-dict{background:var(--sky)}.m-puzzle{background:var(--lav)}.m-memory{background:var(--peach)}.m-garden{background:var(--ink);color:var(--bg)}.m-garden .ic{background:var(--mustard)}.m-garden .ic svg{stroke:var(--ink)}
.bigkana{font-size:92px;line-height:1.05;text-align:center}
.pill{display:inline-block;background:#fff;border-radius:99px;font-size:12.5px;font-weight:700;padding:3px 13px}
.prog{height:12px;background:#fff;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--tomato);border-radius:99px;width:0;transition:width .3s}
.padwrap{position:relative;max-width:360px;margin:8px auto}
svg.pad{width:100%;aspect-ratio:1/1;background:#fff;border-radius:34px 14px 34px 14px;touch-action:none;display:block;box-shadow:inset 0 0 0 4px var(--mustard)}
.levels{display:flex;gap:6px;justify-content:center;margin:8px 0}
.levels .chip{font-size:13px;padding:7px 13px;border-radius:99px}
.res{min-height:76px;display:flex;align-items:center;justify-content:center;gap:16px}
.sc{font-family:"Dela Gothic One",sans-serif;font-size:58px;line-height:1;transform:rotate(-3deg)}
.sc.ok{color:var(--teal)}.sc.ng{color:var(--tomato)}
.stamp{width:66px;height:66px;border-radius:50%;border:3.5px solid var(--tomato);color:var(--tomato);display:grid;place-items:center;align-content:center;transform:rotate(-9deg);line-height:1}
.stamp.ok{border-color:var(--teal);color:var(--teal)}
.stamp b{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:26px}
.stamp small{font-size:9px;font-weight:700;margin-top:1px}
.fb{min-height:44px;text-align:center;font-weight:700;font-size:15px;margin-top:6px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--tomato)}
.btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.choice{font-size:46px;padding:16px 0;text-align:center;border-radius:28px 12px 28px 12px}
.choice:nth-child(even){border-radius:12px 28px 12px 28px}
.choice.ok{background:var(--mint)}.choice.bad{background:var(--coral)}
.arena{position:relative;height:420px;overflow:hidden;background:#cfe6ff;border-radius:34px 14px 34px 14px;margin-top:8px;touch-action:manipulation}
.drop{position:absolute;width:62px;height:62px;display:grid;place-items:center;background:var(--mustard);border-radius:48% 52% 50% 50%;font-size:32px;cursor:pointer;user-select:none}
.drop.pop{animation:pop .25s forwards}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.hearts{font-size:18px;letter-spacing:3px}
.slots{display:flex;gap:8px;justify-content:center;margin:12px 0}
.slot{width:62px;height:70px;border:3px dashed rgba(29,42,68,.3);border-radius:20px 8px 20px 8px;display:grid;place-items:center;font-size:34px;background:rgba(255,255,255,.6);cursor:pointer}
.slot.f{border-style:solid;border-color:transparent;background:#fff}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.tile{width:62px;height:70px;font-size:34px;border-radius:20px 8px 20px 8px;background:var(--mustard);cursor:pointer;display:grid;place-items:center}
.tile.used{opacity:.25;pointer-events:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pic{font-size:130px;text-align:center;line-height:1.35;padding:18px 0 14px}
.pz{display:flex;flex-direction:column;justify-content:center;min-height:calc(100svh - 190px);padding-bottom:30px}.pz .center{margin:6px 0 26px}.pz .slots{gap:12px;margin:26px 0}.pz .slot,.pz .tile{width:76px;height:86px;font-size:40px}.pz .tiles{gap:12px;margin-top:22px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.mcard{aspect-ratio:1/1.05;border-radius:24px 10px 24px 10px;background:var(--teal);display:grid;place-items:center;cursor:pointer;text-align:center;line-height:1.1;font-size:0}
.mcard:nth-child(even){border-radius:10px 24px 10px 24px}
.mcard:not(.up):not(.done):after{content:"?";font-family:"Dela Gothic One",sans-serif;font-size:38px;color:#fff;opacity:.9}
.mcard.up{background:#fff;font-size:38px}
.mcard.up.w{font-size:44px}
.mcard.up.w small{display:block;font-size:14px;font-weight:700;margin-top:2px}
.mcard.done{background:var(--mint);pointer-events:none}
.garden{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.gc{border-radius:18px 7px 18px 7px;background:#fff;text-align:center;padding:5px 0 3px;font-size:22px;line-height:1.15}
.gc i{display:block;font-style:normal;font-size:15px;font-family:"Zen Maru Gothic"}
.gc.l0{background:#f1e3bf;color:#a9976b}.gc.l1{background:#ffd0c2}.gc.l2{background:#ffe49a}.gc.l3{background:#bfeee6}
.gc.empty{visibility:hidden}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:700;margin:6px 0}
.big{font-size:44px;font-weight:800;font-family:"Dela Gothic One",sans-serif;font-weight:400}
.tiles2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#fff;border-radius:22px 8px 22px 8px;padding:10px 14px}
.stat b{font-size:24px;display:block;line-height:1.1}.stat span{font-size:12px;color:var(--muted);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 6px;border-bottom:1.5px solid #f1e3bf;text-align:left}
th{color:var(--muted);font-size:11.5px}
.bar{height:10px;border-radius:6px;background:#f1e3bf;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--teal)}
.bar.bad i{background:var(--tomato)}
.tlist button{display:flex;width:100%;justify-content:space-between;align-items:center;margin-bottom:10px;text-align:left;border-radius:22px 8px 22px 8px}
.note{font-size:12px;color:var(--muted)}
input[type=text]{font-family:inherit;font-weight:700;font-size:18px;border:none;border-radius:24px 10px 24px 10px;padding:14px 18px;width:100%;max-width:280px;display:block;margin:16px auto;text-align:center;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:3px solid var(--mustard)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.toast.on{opacity:1}
footer{margin-top:30px;font-size:11px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<svg id="samp" width="0" height="0" style="position:absolute"></svg>
<div class="wrap">

<!-- LOGIN -->
<section class="screen on" id="s-login">
  <div class="center" style="padding-top:20px">
    <div id="m-login"></div>
    <h1>ひらがなの にわ</h1>
    <p class="sub">Hiragana Garden</p>
    <p style="margin:14px 0 0">Every letter you practice makes a little seed grow. Let's plant your garden!</p>
    <input type="text" id="nameIn" placeholder="Your name" autocomplete="off" maxlength="30">
    <button class="btn pink" id="goBtn" style="width:100%;max-width:280px">Start 🌱</button>
    <p class="note" style="margin-top:14px"><a href="#" id="teachLink" style="color:var(--muted)">Teacher</a></p>
  </div>
</section>

<!-- HOME -->
<section class="screen" id="s-home">
  <div class="top"><div><b id="hiName"></b></div><div class="sp"></div><button class="back" id="logoutBtn">Switch name</button></div>
  <div class="hello"><div id="m-home"></div><div class="bubble" id="homeMsg"></div></div>

  <h2><span class="n">1</span>Choose your letters</h2>
  <div class="sets" id="setChips"></div>
  <div id="rowsBox" style="margin-top:8px"></div>
  <p class="sub" id="poolInfo" style="margin-top:6px"></p>

  <h2><span class="n">2</span>Pick an activity</h2>
  <div class="menu" id="menu"></div>
  <footer>Stroke data: KanjiVG (CC BY-SA 3.0) · Voice: your device's Japanese voice</footer>
</section>

<!-- WRITE -->
<section class="screen" id="s-write">
  <div class="top"><button class="back" data-home>← Home</button><div class="sp"></div><span class="pill" id="wCount"></span></div>
  <div class="prog"><i id="wProg"></i></div>
  <div class="center" style="margin-top:8px"><span class="pill" id="wStep"></span></div>
  <div class="levels" id="wLevels"></div>
  <div id="wHost"></div>
  <div class="btnrow"><button class="btn sm" id="wSkip">Skip →</button><button class="btn pink sm" id="wNext" style="display:none">Next letter →</button></div>
</section>

<!-- GAME generic -->
<section class="screen" id="s-game">
  <div class="top"><button class="back" data-home>← Home</button><div class="sp"></div><span class="pill" id="gInfo"></span></div>
  <div class="prog"><i id="gProg"></i></div>
  <div id="gBody"></div>
</section>

<!-- RESULT -->
<section class="screen" id="s-result">
  <div class="center" style="padding-top:20px">
    <div id="m-result"></div>
    <h1 id="rTitle"></h1>
    <p class="big" id="rScore"></p>
    <p id="rMsg" style="margin:6px 0 16px"></p>
    <div class="btnrow"><button class="btn pink" id="rAgain">Play again</button><button class="btn" data-home>Home</button><button class="btn mint" id="rGarden">My garden 🌸</button></div>
  </div>
</section>

<!-- GARDEN -->
<section class="screen" id="s-garden">
  <div class="top"><button class="back" data-home>← Home</button></div>
  <div class="gm" id="m-garden"></div>
  <h1>My Garden 🌸</h1>
  <p class="sub" id="gdSub"></p>
  <div class="legend"><span>· not yet</span><span>🌱 growing</span><span>🌿 getting there</span><span>🌸 strong</span></div>
  <div id="gdBox"></div>
</section>

<!-- TEACHER -->
<section class="screen" id="s-teacher">
  <div class="top"><button class="back" id="tBack">← Back</button><div class="sp"></div><button class="back" data-home2>Exit</button></div>
  <div id="tBox"></div>
</section>

</div>
<div class="toast" id="toast"></div>

/* weighted pick (weaker letters appear a bit more) */
function weightedSample(pool,n){
  const w=u=>{const s=S.stats[u];if(!s||!s.n)return 2;const a=s.recent.reduce((x,y)=>x+y,0)/s.recent.length;return 1+(1-a)*2};
  const items=pool.map(u=>({u,w:w(u)}));const out=[];
  while(out.length<n){if(!items.length){items.push(...pool.map(u=>({u,w:1})))}
    const t=items.reduce((a,b)=>a+b.w,0);let r=Math.random()*t,i=0;for(;i<items.length-1;i++){r-=items[i].w;if(r<=0)break}
    out.push(items[i].u);items.splice(i,1)}
  return out}
function distractors(u,pool,n){
  const base=x=>x[0].normalize('NFD')[0];
  const sim=new Set();LOOK.forEach(g=>{if(g.includes(u))[...g].forEach(c=>c!==u&&sim.add(c))});
  ALL.forEach(c=>{if(c!==u&&c.length===u.length&&base(c)===base(u))sim.add(c)});
  const sameLen=c=>c.length===u.length&&c!==u;
  const cands=[...sim].filter(c=>pool.includes(c)&&sameLen(c));
  const rest=shuf(pool.filter(c=>sameLen(c)&&!cands.includes(c)));
  let out=shuf(cands).concat(rest);
  if(out.length<n){const extra=shuf((u.length===1?BASIC:ALL.filter(c=>c.length===u.length)).filter(c=>c!==u&&!out.includes(c)));out=out.concat(extra)}
  return out.slice(0,n)}

/* ───────── writer ───────── */
const partsOf=u=>u.length===2?[u[0],u[1]]:[u];
const tfOf=(u,i)=>i===1?{s:.62,tx:2,ty:44}:{s:1,tx:0,ty:0};
const NPT=32;
function sampleRef(ch,tf){return STROKES[ch].map(d=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);$('samp').appendChild(p);const L=p.getTotalLength();const pts=[];
  for(let i=0;i<NPT;i++){const q=p.getPointAtLength(L*i/(NPT-1));pts.push([q.x*tf.s+tf.tx,q.y*tf.s+tf.ty])}$('samp').removeChild(p);return pts})}
function resample(pts,n=NPT){
  if(pts.length===1)return Array.from({length:n},()=>pts[0].slice());
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const L=cum[cum.length-1];if(L<1e-6)return Array.from({length:n},()=>pts[0].slice());
  const out=[];let j=0;for(let i=0;i<n;i++){const t=L*i/(n-1);while(j<cum.length-2&&cum[j+1]<t)j++;const seg=cum[j+1]-cum[j]||1;const f=(t-cum[j])/seg;out.push([pts[j][0]+(pts[j+1][0]-pts[j][0])*f,pts[j][1]+(pts[j+1][1]-pts[j][1])*f])}
  return out}
const meanD=(a,b)=>{let s=0;for(let i=0;i<a.length;i++)s+=Math.hypot(a[i][0]-b[i][0],a[i][1]-b[i][1]);return s/a.length};
const bbox=pts=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;pts.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])});return{x0,y0,x1,y1,w:x1-x0,h:y1-y0,cx:(x0+x1)/2,cy:(y0+y1)/2}};
const REFC={};
function refOf(ch,tf){const k=ch+'|'+tf.s+'|'+tf.tx+'|'+tf.ty;return REFC[k]||(REFC[k]=sampleRef(ch,tf))}
const plen=p=>{let s=0;for(let i=1;i<p.length;i++)s+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return s};
function fitTo(U,R){
  const ub=bbox(U.flat()),rb=bbox(R.flat());const us=Math.max(ub.w,ub.h),rs=Math.max(rb.w,rb.h);const k=us<1e-6?1:rs/us;
  return{us,rs,k,Un:U.map(st=>resample(st.map(p=>[(p[0]-ub.cx)*k+rb.cx,(p[1]-ub.cy)*k+rb.cy])))}}
const dirWord=v=>Math.abs(v[0])>=Math.abs(v[1])?(v[0]<0?'left':'right'):(v[1]<0?'up':'down');
const NOUN=['count','size'];
function judge(U,ch,tf,level){
  const R=refOf(ch,tf),n=R.length;
  if(U.length!==n){
    const nf=ch.normalize('NFD');let extra='';
    if(nf.length>1&&U.length===n-2)extra=' Did you forget the two small marks (゛ or ゜)?';
    else if(U.length<n)extra=' You are missing '+(n-U.length)+' stroke'+(n-U.length>1?'s':'')+'.';
    else extra=' You wrote '+(U.length-n)+' too many.';
    return{ok:false,score:25,marks:[],reason:'count',msg:`${ch} has ${n} stroke${n>1?'s':''}. You wrote ${U.length}.`+extra}}
  const F=fitTo(U,R);
  if(F.us<F.rs*.3)return{ok:false,score:40,marks:[],reason:'size',msg:'A little bigger, please! Use more of the box.'};
  const Rn=R.map(r=>resample(r));
  const thr=Math.max(9,({1:19,2:15,3:12.5}[level]||15)*tf.s);
  const lo=level===3?.7:.55,hi=level===3?1.7:1.9,ends=thr*1.7;
  const flags=[],bad=[],scs=[];
  F.Un.forEach((u,i)=>{
    const r=Rn[i],d=meanD(u,r),rd=meanD(u,r.slice().reverse());
    const lr=plen(u)/(plen(r)||1);
    const sd=[u[0][0]-r[0][0],u[0][1]-r[0][1]],ed=[u[NPT-1][0]-r[NPT-1][0],u[NPT-1][1]-r[NPT-1][1]];
    const iss=[];
    if(d>=thr)iss.push(rd<thr*.9?'dir':'shape');
    if(plen(r)>24){if(lr<lo)iss.push('short');else if(lr>hi)iss.push('long')}
    if(Math.hypot(sd[0],sd[1])>ends)iss.push('start');
    if(Math.hypot(ed[0],ed[1])>ends)iss.push('end');
    if(iss.length){for(let j=0;j<n;j++)if(j!==i&&meanD(u,Rn[j])<thr){iss.unshift('order');break}}
    scs.push(Math.max(0,100-30*d/thr-12*iss.length));flags.push(!iss.length);if(iss.length)bad.push({i,iss,sd,ed,d,rm:r[16],r0:r[0],r1:r[NPT-1]})});
  const total=Math.round(scs.reduce((a,b)=>a+b,0)/n);
  const say=b=>{const P={order:'is out of order',dir:'goes the other way',shape:'has a different curve',short:'is too short',long:'is too long'};
    const parts=b.iss.map(k=>P[k]||(k==='start'?'starts too far '+dirWord(b.sd):'ends too far '+dirWord(b.ed)));
    return `Stroke ${b.i+1} ${parts.slice(0,2).join(' and ')}.`};
  /* does it look like a different letter? */
  const mine=F.Un.reduce((s,u,i)=>s+meanD(u,Rn[i]),0)/n;
  let best=null;
  const small='ゃゅょ'.includes(ch);
  const pool=small?['ゃ','ゅ','ょ']:ALL.filter(c=>c.length===1&&!'ゃゅょ'.includes(c));
  for(const x of pool){if(x===ch||!STROKES[x]||STROKES[x].length!==n)continue;
    const Rx=refOf(x,tf),Fx=fitTo(U,Rx);const Rxn=Rx.map(r=>resample(r));
    const sc=Fx.Un.reduce((s,u,i)=>s+meanD(u,Rxn[i]),0)/n;
    if(!best||sc<best.sc)best={x,sc}}
  if(best&&best.sc<mine*.8&&best.sc<thr*1.15){
    const w=bad.length?' '+say(bad.sort((p,q)=>q.d-p.d)[0]):' Compare the shape with the pink guide.';
    return{ok:false,score:Math.min(total,55),marks:bad,reason:'confused>'+best.x,flags,msg:`This looks more like “${best.x}” than “${ch}”.`+w}}
  if(!bad.length)return{ok:true,score:Math.max(70,total)};
  bad.sort((p,q)=>q.d-p.d);
  const first=bad[0],pr=['order','dir','shape','short','long','start','end'];
  const reason=pr.find(k=>first.iss.includes(k))||'shape';
  const msg=bad.slice(0,2).map(say).join(' ');
  return{ok:false,score:Math.min(total,69),marks:bad,reason,flags,msg}}

/* word helpers */
function unitsOf(w){const out=[];for(let i=0;i<w.length;i++){const c=w[i],n=w[i+1];if(n&&'ゃゅょ'.includes(n)){out.push(c+n);i++}else out.push(c)}return out}
const WU=WORDS.map(([w,e])=>({w,e,u:unitsOf(w)}));
function wordsFor(pool){return WU.filter(x=>x.u.every(u=>pool.includes(u)))}
function memUnits(pool){return pool.filter(u=>WU.some(x=>x.u[0]===u))}

/* word puzzle */
function startPuzzle(){
  const ws=shuf(wordsFor(poolUnits())).slice(0,6);gameScreen('Word Puzzle',ws.length);G.ws=ws;puzzleQ()}
function puzzleQ(){
  if(G.i>=G.total){finish('Word Puzzle','',`${G.score} / ${G.total}`,'Words are made of letters you know now! 🌸');return}
  const x=G.ws[G.i];G.slots=Array(x.u.length).fill(null);G.tiles=shuf(x.u.map((u,i)=>({u,i,used:false})));
  if(x.u.length>1&&G.tiles.every((t,k)=>t.u===x.u[k]))G.tiles.reverse();
  G.miss=false;
  const draw=()=>{$('gBody').innerHTML=`<div class="pz"><div class="pic">${x.e}</div><div class="center"><button class="btn sm pink" id="pHear">${SPK} Hear it</button></div><div class="slots" id="pSlots">${G.slots.map((s,k)=>`<div class="slot kana ${s?'f':''}" data-k="${k}">${s?s.u:''}</div>`).join('')}</div><div class="tiles">${G.tiles.map((t,k)=>`<div class="tile kana ${t.used?'used':''}" data-t="${k}">${t.u}</div>`).join('')}</div><div class="fb" id="pFb"></div></div>`;
    $('pHear').onclick=()=>speak(x.w)};
  draw();
  $('gBody').onclick=e=>{const t=e.target.closest('[data-t]'),s=e.target.closest('[data-k]');
    if(t){const tile=G.tiles[+t.dataset.t];const k=G.slots.indexOf(null);if(k<0||tile.used)return;tile.used=true;G.slots[k]=tile;draw();speak(tile.u);
      if(G.slots.every(Boolean)){const got=G.slots.map(z=>z.u).join('|'),want=x.u.join('|');
        if(got===want){rec('puzzle',x.w,!G.miss);if(!G.miss)G.score++;$('pFb').textContent='✨ '+x.w;$('pFb').className='fb ok';speak(x.w);G.i++;gProg();setTimeout(puzzleQ,1500)}
        else{G.miss=true;rec('puzzle',x.w,false,G.slots.map(z=>z.u).join(''));$('pSlots').classList.add('shake');setTimeout(()=>{G.slots.fill(null);G.tiles.forEach(z=>z.used=false);draw();$('pFb').textContent='Not quite. Try again!';$('pFb').className='fb bad'},450)}}}
    else if(s){const k=+s.dataset.k;const z=G.slots[k];if(!z)return;z.used=false;G.slots[k]=null;draw()}}}

  const tot=rows.length,ok=rows.filter(r=>r.correct).length;
  const days={};rows.forEach(r=>{const d=new Date(r.created_at).toLocaleDateString();const x=days[d]||(days[d]={n:0,c:0});x.n++;if(r.correct)x.c++});
  const modes={};rows.forEach(r=>{const m=r.mode.replace(/\d$/,m=>'');const x=modes[m]||(modes[m]={n:0,c:0});x.n++;if(r.correct)x.c++});
  const MN={write1:'Write · trace',write2:'Write · fade',write3:'Write · memory',sound:'Sound Match',catch:'Letter Catch',dict:'Listen & Write',puzzle:'Word Puzzle',memory:'Memory Match'};
  const md={};rows.forEach(r=>{const x=md[r.mode]||(md[r.mode]={n:0,c:0});x.n++;if(r.correct)x.c++});
  const attention=Object.entries(st).filter(([u,s])=>s.n>=2&&(s.c/s.n<.7||s.recent.slice(-2).every(v=>v===0))).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).slice(0,10);
  const conf={};rows.forEach(r=>{if(r.correct||!r.given||!isUnit(r.ch))return;const g=r.given.startsWith('w:confused>')?r.given.slice(11):(r.given.startsWith('w:')?null:r.given);if(g&&isUnit(g)){const k=r.ch+'→'+g;conf[k]=(conf[k]||0)+1}});
  const confs=Object.entries(conf).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const WHY={count:'wrong number of strokes',order:'stroke order',dir:'stroke direction',direction:'stroke direction',shape:'shape of the curve',short:'stroke too short',long:'stroke too long',start:'wrong starting point',end:'wrong ending point',size:'size',gaveup:'gave up'};const whyTxt=k=>k.startsWith('confused>')?'looked like '+k.slice(9):(WHY[k]||k);
  const sent=[];
  if(attention.length)sent.push(`Needs attention: ${attention.slice(0,5).map(([u,s])=>`<b class="kana">${u}</b> (${s.c}/${s.n})`).join(', ')}.`);
  confs.filter(c=>c[1]>=2).slice(0,3).forEach(([k,n])=>{const[a,b]=k.split('→');sent.push(`<b class="kana">${a}</b> is often mistaken for <b class="kana">${b}</b> (${n}×).`)});
  Object.entries(st).filter(([u,s])=>Object.values(s.why).reduce((x,y)=>x+y,0)>=2).slice(0,3).forEach(([u,s])=>{const top=Object.entries(s.why).sort((a,b)=>b[1]-a[1])[0];sent.push(`Writing <b class="kana">${u}</b>: most errors are ${whyTxt(top[0])} (${top[1]}×).`)});
  const strong=Object.values(st).filter(s=>mastery(s)===3).length;
  const dl=Object.entries(days).slice(-10).reverse();
  const m=[0,0,0,0];ALL.forEach(u=>m[mastery(st[u])]++);
  $('tBox').innerHTML=`<h1>${name}</h1><p class="sub">Hiragana Garden progress</p>
  <div class="tiles2" style="margin:12px 0"><div class="stat"><b>${tot}</b><span>answers in total</span></div><div class="stat"><b>${Math.round(ok/tot*100)}%</b><span>correct overall</span></div><div class="stat"><b>${Object.keys(days).length}</b><span>days practiced</span></div><div class="stat"><b>${strong}</b><span>letters strong 🌸</span></div></div>
  ${sent.length?`<h2>QUICK READ</h2><div class="card"><ul style="margin:0;padding-left:18px">${sent.map(s=>`<li style="margin:4px 0">${s}</li>`).join('')}</ul></div>`:''}
  <h2>GARDEN</h2><div class="legend"><span>· not yet</span><span>🌱 growing</span><span>🌿 getting there</span><span>🌸 strong</span></div>${gardenHTML(st)}
  <h2>BY ACTIVITY</h2><div class="card"><table>${Object.entries(md).map(([k,v])=>`<tr><td>${MN[k]||k}</td><td>${v.c}/${v.n}</td><td style="width:40%"><div class="bar"><i style="width:${v.c/v.n*100}%"></i></div></td></tr>`).join('')}</table></div>
  ${attention.length?`<h2>NEEDS ATTENTION</h2><div class="card"><table><tr><th>Letter</th><th>Correct</th><th></th><th>Writing errors</th></tr>${attention.map(([u,s])=>`<tr><td class="kana" style="font-size:20px">${u}</td><td>${s.c}/${s.n}</td><td style="width:30%"><div class="bar bad"><i style="width:${s.c/s.n*100}%"></i></div></td><td class="note">${Object.entries(s.why).map(([k,n])=>`${whyTxt(k)} ${n}`).join(', ')}</td></tr>`).join('')}</table></div>`:''}
  ${confs.length?`<h2>MIX-UPS (chosen instead)</h2><div class="card"><table>${confs.map(([k,n])=>{const[a,b]=k.split('→');return `<tr><td class="kana" style="font-size:20px">${a} → ${b}</td><td>${n}×</td></tr>`}).join('')}</table></div>`:''}
  <h2>RECENT DAYS</h2><div class="card"><table>${dl.map(([d,v])=>`<tr><td>${d}</td><td>${v.n} answers</td><td>${Math.round(v.c/v.n*100)}%</td></tr>`).join('')}</table></div>`;
  $('tBox').onclick=null}

/* ───────── boot ───────── */
$('m-login').innerHTML=mascot('hello');$('m-result').innerHTML=mascot('cheer');
$('nameIn').value=ls.get('hira.name','');
$('goBtn').onclick=()=>login($('nameIn').value);
$('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')login($('nameIn').value)});
$('logoutBtn').onclick=()=>{S.student=null;S.stats={};show('s-login')};
</script>
</body>
